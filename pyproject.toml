[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "long-core-control"
version = "0.2.0"
description = "Simulation-first PySide6 migration of the 2G Long Core LabVIEW application"
requires-python = ">=3.11"
# PySide6-Essentials (not the PySide6 metapackage): the app uses only
# QtCore, QtGui, and QtWidgets; the metapackage drags in ~1GB of
# QtWebEngine/QML/3D modules that nothing in this project imports.
dependencies = ["PySide6-Essentials>=6.7,<7", "pyserial>=3.5,<4"]

[project.optional-dependencies]
# Reverse-engineering extraction pipeline (tools/extract_vi.py).
# tesseract itself is a system dependency (homebrew: `brew install tesseract`).
extract = ["pylabview==0.1.2", "pillow>=10"]
packaging = ["pyinstaller>=6.10,<7", "pillow>=10"]

[project.scripts]
long-core-control = "long_core_gui.app:main"

[tool.setuptools.packages.find]
include = ["long_core_gui*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
